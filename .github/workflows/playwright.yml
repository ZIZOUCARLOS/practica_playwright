name: Playwright E2E Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  e2e-tests:
    name: Ejecutar Pruebas E2E (Playwright)
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js con cache de npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Instalar dependencias del proyecto
        run: npm ci

      - name: 4. Instalar navegadores de Playwright y dependencias del SO
        run: npx playwright install --with-deps chromium firefox

      - name: 5. Ejecutar suite de pruebas E2E
        run: npx playwright test
        env:
          CI: true

      - name: 6. Subir Reporte HTML de Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: 7. Subir Evidencias de fallos (Traces, Screenshots, Videos)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-failures
          path: test-results/
          retention-days: 7